name: symtony

x-app: &app
  build:
    context: .
    target: dev
  image: symtony-app:dev
  volumes:
    - ./:/app
    # Keep var/ (cache, logs) inside the container: bind-mounted cache is very slow on Windows/macOS.
    - app_var:/app/var
    # vendor/ lives in a volume too: autoloading thousands of files over a Windows bind mount costs ~10 s/request.
    # Run `composer` inside the container (make composer c=...). See README for IDE autocompletion.
    - app_vendor:/app/vendor
    # Test Lab jobs shared with the isolated runner
    - runner_jobs:/jobs
  environment:
    DATABASE_URL: "postgresql://symtony:symtony@db:5432/symtony?serverVersion=16&charset=utf8"
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "${SYMTONY_HTTP_PORT:-8080}:80"

  worker:
    <<: *app
    # Groups events into incidents and runs investigations. Restarts hourly (or after code changes: docker compose restart worker).
    command: ["php", "bin/console", "messenger:consume", "async", "investigations", "--time-limit=3600", "--memory-limit=256M", "-v"]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: symtony
      POSTGRES_USER: symtony
      POSTGRES_PASSWORD: symtony
    ports:
      - "${SYMTONY_DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symtony -d symtony"]
      interval: 3s
      timeout: 5s
      retries: 20

  # A small, real Symfony shop with a real checkout bug, instrumented by packages/symtony-bundle.
  demo-shop:
    image: symtony-app:dev
    working_dir: /app
    volumes:
      - ./demo-shop:/app
      - ./packages:/packages
      - shop_var:/app/var
      - shop_vendor:/app/vendor
    environment:
      APP_ENV: dev
      SYMTONY_ENDPOINT: http://app/api/v1/events
      DEMO_SHOP_SECRET: ${DEMO_SHOP_SECRET:-local-demo-secret}
    ports:
      - "${SYMTONY_SHOP_PORT:-8081}:80"
    depends_on:
      - app
  # Isolated PHPUnit runner for the Test Lab: no network, read-only root FS, limited CPU/memory, non-root.
  # Communicates with SYMTONY only through the runner_jobs volume. See runner/run.sh.
  runner:
    image: symtony-app:dev
    entrypoint: ["sh", "/runner/run.sh"]
    network_mode: none
    read_only: true
    user: "65534:65534"
    tmpfs:
      - /tmp:size=768m,mode=1777
    volumes:
      - ./runner:/runner:ro
      - ./demo-shop:/src:ro
      - shop_vendor:/src-vendor:ro
      - ./packages:/packages:ro
      - runner_jobs:/jobs
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      disable: true

volumes:
  db_data:
  app_var:
  app_vendor:
  shop_var:
  shop_vendor:
  runner_jobs:
