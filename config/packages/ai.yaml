ai:
    # https://symfony.com/doc/current/ai/components/platform.html
    # One platform per provider. Agents use App\Infrastructure\AI\SelectedPlatform, which forwards to the
    # one named by SYMTONY_AI_PROVIDER, so only that provider's key is needed (see .env).
    platform:
        huggingface:
            api_key: '%env(HUGGINGFACE_API_KEY)%'
            # Leave empty to let Hugging Face route to an available inference provider.
            provider: '%env(default::HUGGINGFACE_PROVIDER)%'
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
        anthropic:
            api_key: '%env(ANTHROPIC_API_KEY)%'
        gemini:
            api_key: '%env(GEMINI_API_KEY)%'
        openrouter:
            api_key: '%env(OPENROUTER_API_KEY)%'
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
        deepseek:
            api_key: '%env(DEEPSEEK_API_KEY)%'
        # Any OpenAI-compatible endpoint (Groq, Together, Fireworks, Ollama, LM Studio, vLLM...).
        generic:
            custom:
                base_url: '%env(GENERIC_BASE_URL)%'
                api_key: '%env(GENERIC_API_KEY)%'

    # https://symfony.com/doc/current/ai/bundles/ai-bundle.html
    agent:
        # Root-cause investigator. Reads only the current investigation's redacted evidence through tools.
        investigator:
            platform: 'App\Infrastructure\AI\SelectedPlatform'
            model: '%env(symtony_ai_model:SYMTONY_AI_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/investigator.md'
            tools:
                services:
                    - 'App\Infrastructure\AI\Tool\EvidenceTools'
            max_tool_calls: 12
            fault_tolerant_toolbox: true

        # Regression test writer. Reads evidence and an allow-list of source files; output is only a proposal.
        test_writer:
            platform: 'App\Infrastructure\AI\SelectedPlatform'
            model: '%env(symtony_ai_model:SYMTONY_AI_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/test_writer.md'
            tools:
                services:
                    - 'App\Infrastructure\AI\Tool\EvidenceTools'
                    - 'App\Infrastructure\AI\Tool\SourceFileTool'
            max_tool_calls: 12

        # Assistant panel on incident/investigation pages: answers questions from the same evidence tools.
        assistant:
            platform: 'App\Infrastructure\AI\SelectedPlatform'
            model: '%env(symtony_ai_model:SYMTONY_AI_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/assistant.md'
            tools:
                services:
                    - 'App\Infrastructure\AI\Tool\EvidenceTools'
            max_tool_calls: 8
            fault_tolerant_toolbox: true

        # Phase 0 spike agent (verifies tool calling + structured output; removed once a key is verified)
        spike:
            platform: 'App\Infrastructure\AI\SelectedPlatform'
            model: '%env(symtony_ai_model:SYMTONY_AI_MODEL)%'
            tools:
                services:
                    - 'App\Spike\ClockTool'
