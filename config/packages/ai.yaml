ai:
    # https://symfony.com/doc/current/ai/components/platform.html
    platform:
        huggingface:
            api_key: '%env(HUGGINGFACE_API_KEY)%'
            # Leave empty to let Hugging Face route to an available inference provider.
            provider: '%env(default::HUGGINGFACE_PROVIDER)%'

    # https://symfony.com/doc/current/ai/bundles/ai-bundle.html
    agent:
        # Root-cause investigator. Reads only the current investigation's redacted evidence through tools.
        investigator:
            platform: 'ai.platform.huggingface'
            model: '%env(SYMTONY_AI_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/investigator.md'
            tools:
                services:
                    - 'App\Infrastructure\AI\Tool\EvidenceTools'
            max_tool_calls: 12
            fault_tolerant_toolbox: true

        # Regression test writer. Reads evidence and an allow-list of source files; output is only a proposal.
        test_writer:
            platform: 'ai.platform.huggingface'
            model: '%env(SYMTONY_AI_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/test_writer.md'
            tools:
                services:
                    - 'App\Infrastructure\AI\Tool\EvidenceTools'
                    - 'App\Infrastructure\AI\Tool\SourceFileTool'
            max_tool_calls: 12

        # Phase 0 spike agent (verifies tool calling + structured output; removed once a key is verified)
        spike:
            platform: 'ai.platform.huggingface'
            model: '%env(SYMTONY_AI_MODEL)%'
            tools:
                services:
                    - 'App\Spike\ClockTool'
