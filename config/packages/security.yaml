security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Domain\Workspace\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Machine endpoints authenticate with their own tokens (ingestion: Phase 2, MCP: Phase 8).
        ingestion:
            pattern: ^/api/v1/
            stateless: true
            security: false
        mcp:
            pattern: ^/mcp
            stateless: true
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_overview
                enable_csrf: true
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                # "?form" keeps the public demo from signing the visitor straight back in.
                target: /login?form=1
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 1209600
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/app, roles: ROLE_USER }
        - { path: ^/styleguide, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
