framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            investigations:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: investigations
                retry_strategy:
                    max_retries: 2
                    delay: 2000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Routes are added per message class as phases introduce them.

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                investigations: 'in-memory://'
