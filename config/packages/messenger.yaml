framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    # Poll (1 s) instead of LISTEN/NOTIFY: the notify trigger is not part of our migrations.
                    use_notify: false
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            investigations:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: investigations
                    use_notify: false
                retry_strategy:
                    max_retries: 2
                    delay: 2000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'App\Infrastructure\Ingestion\Message\EventsIngested': async
            'App\Application\Investigation\RunInvestigation': investigations
            'App\Application\TestLab\CollectTestResults': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                investigations: 'in-memory://'
